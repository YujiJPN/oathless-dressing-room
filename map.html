<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoE zones</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr; font: 13px/1.4 system-ui, sans-serif; background: #202327; color: #ddd; }
  aside { overflow: auto; padding: 10px 12px; border-right: 1px solid #333; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9aa; margin: 14px 0 6px; }
  a { color: #8cf; }
  select, input[type=text], button { background: #2b2f35; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font: inherit; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; margin: 2px 4px 2px 0; }
  button:hover { border-color: #888; }
  #list { max-height: 48vh; overflow: auto; border: 1px solid #333; border-radius: 4px; }
  #list div { padding: 3px 6px; cursor: pointer; border-bottom: 1px solid #2d3136; }
  #list div:hover, #list div.sel { background: #343a42; }
  #list .meta { color: #8a9; font-size: 11px; margin-left: 6px; }
  main { position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  #status { position: absolute; left: 10px; bottom: 8px; color: #bbb; font-size: 12px; pointer-events: none; }
  #info { font-size: 12px; color: #bbb; white-space: pre-wrap; }
  label { display: block; margin: 3px 0; }
</style>
</head>
<body>
<aside>
  <h1>MoE zones <span style="font-weight:normal;color:#9aa">· <a href="/viewer/">dressing room</a></span></h1>
  <input id="q" type="text" placeholder="filter by file, zone number…">
  <div id="list"></div>
  <h2>View</h2>
  <label><input id="tex" type="checkbox" checked> textures</label>
  <label><input id="vcol" type="checkbox" checked> baked vertex lighting</label>
  <label><input id="wire" type="checkbox"> wireframe</label>
  <div><button id="top">Top view</button><button id="fit">Fit</button><button id="shot">Screenshot</button></div>
  <p style="color:#9aa;font-size:12px">Drag to orbit, right-drag to pan, wheel to zoom. W/A/S/D fly, Q/E down/up, Shift = faster.</p>
  <h2>Zone</h2>
  <div id="info">pick a zone</div>
</aside>
<main>
  <canvas id="view"></canvas>
  <div id="status">loading list…</div>
</main>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="map.js"></script>
</body>
</html>

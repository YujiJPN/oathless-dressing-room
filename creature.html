<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>creature clip</title>
<style>html,body{margin:0;height:100%;background:#2b2d33;color:#ddd;font:12px system-ui}#info{position:fixed;left:8px;top:8px;white-space:pre}
#bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:8px;align-items:center}#t{flex:1}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="info">loading…</div><div id="bar"><button id="play">pause</button><input id="t" type="range" min="0" max="1000" value="0"></div>
<script type="module">
// Debug page for the UE creature export: /viewer/creature.html?id=175&clip=A0004_walk_forward&view=side
// Loads extracted/ue/creatures/<id>/body.glb and clips/<clip>.glb and plays the clip on the body (bones by name).
// ?t=0.5 freezes at that fraction of the clip (for screenshots).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const id = q.get('id') || '175', clipName = q.get('clip') || 'A0001_idle';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight - 40); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2d33);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(1, 2, 3); scene.add(dl);
scene.add(new THREE.GridHelper(4, 40, 0x555555, 0x3a3a3a));
const camera = new THREE.PerspectiveCamera(35, innerWidth / (innerHeight - 40), 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
const info = document.getElementById('info');
const loader = new GLTFLoader();
const base = `/extracted/ue/creatures/${id}/`;
let mixer = null, action = null, playing = !q.get('t');
loader.load(base + 'body.glb', (g) => {
  const root = g.scene; scene.add(root);
  const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z) * 2.2 + 0.3;
  const v = q.get('view') || 'front';
  camera.position.set(c.x + (v === 'side' ? d : d * 0.3), c.y + size.y * 0.3, c.z + (v === 'side' ? 0 : d));
  controls.target.copy(c); controls.update();
  // ?focus=<bone>&dist=<m>: frame one bone (the head) from in front, along the body-centre -> bone direction
  const focusAt = () => {
    const bone = q.get('focus') && root.getObjectByName(q.get('focus'));
    if (!bone) return;
    root.updateMatrixWorld(true);
    const p = bone.getWorldPosition(new THREE.Vector3());
    const dir = p.clone().sub(c); dir.y = 0; if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1); dir.normalize();
    const dd = Number(q.get('dist') || size.y * 0.9);
    const ang = Number(q.get('ang') || 0) * Math.PI / 180;   // 0 = straight in front of the bone, 90 = from its side
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
    camera.position.copy(p).addScaledVector(dir, dd).add(new THREE.Vector3(0, dd * 0.15, 0));
    controls.target.copy(p); controls.update();
  };
  window.__focus = focusAt; setTimeout(focusAt, 300);
  window.__dbg = { root, camera, controls, THREE, box };
  if (q.get('wire')) root.traverse((o) => { if (o.material) o.material.wireframe = true; });
  if (q.get('flat')) root.traverse((o) => { if (o.material) { o.material = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide, flatShading: true }); } });
  loader.load(base + 'clips/' + clipName + '.glb', (a) => {
    const clip = a.animations[0];
    mixer = new THREE.AnimationMixer(root); action = mixer.clipAction(clip); action.play();
    const bound = clip.tracks.filter((t) => root.getObjectByName(t.name.split('.')[0])).length;
    info.textContent = `C${id} ${clipName}\n${clip.duration.toFixed(2)} s, ${clip.tracks.length} tracks, ${bound} bound to the body`;
    if (q.get('t')) { mixer.setTime(clip.duration * Number(q.get('t'))); document.getElementById('t').value = Number(q.get('t')) * 1000; }
    document.getElementById('t').oninput = (e) => { playing = false; mixer.setTime(clip.duration * e.target.value / 1000); };
  }, undefined, (e) => { info.textContent = 'clip load failed: ' + e; });
}, undefined, (e) => { info.textContent = 'body load failed: ' + e; });
document.getElementById('play').onclick = () => { playing = !playing; document.getElementById('play').textContent = playing ? 'pause' : 'play'; };
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); if (mixer && playing) mixer.update(dt); renderer.render(scene, camera); });
</script></body></html>

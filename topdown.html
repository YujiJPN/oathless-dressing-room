<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoE zones: top-down sheets</title>
<style>body { margin: 0; background: #15181d; color: #ccc; font: 13px system-ui; } #st { padding: 8px; } canvas { display: block; }</style>
</head>
<body>
<div id="st">starting…</div>
<canvas id="gl" width="512" height="512" style="position:absolute;left:-9999px"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// Renders every unique zone/house model twice (straight down, and a 3/4 view from the south-east) into labelled contact
// sheets of 3 x 3 maps with their names, and posts each sheet to the scratch save server (?save=<port>). Private analysis output.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const st = (t) => { document.getElementById('st').textContent = t; };
const savePort = new URLSearchParams(location.search).get('save') || '8778';
const rows = (await fetch('/tables/reference-maps.csv').then((r) => r.text())).split(/\r?\n/).filter(Boolean);
// CSV line -> fields (handles quoted fields)
const split = (l) => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const ch = l[i];
  if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
  else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; };
const head = split(rows[0]);
const maps = new Map();
for (const l of rows.slice(1)) {
  const c = split(l); const o = {}; head.forEach((h, i) => { o[h] = c[i]; });
  if (!o.model) continue;
  const m = maps.get(o.model) || { ...o, zones: [] };
  m.zones.push(o.zone_index);
  maps.set(o.model, m);
}
const order = ['field (large outdoor)', 'area (town / mid field)', 'dungeon / big interior', 'building / room'];
// picture order = picture_no from tools/map_names.py (by age, then size class, then footprint)
const list = [...maps.values()].sort((a, b) => (+a.picture_no || 999) - (+b.picture_no || 999) || order.indexOf(a.kind) - order.indexOf(b.kind) || (b.width_m * b.depth_m) - (a.width_m * a.depth_m));

const gl = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(512, 512, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2230);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(300, 600, 200); scene.add(sun);
const loader = new GLTFLoader();
loader.setResourcePath(location.origin + '/extracted/zones/');

const CELL = 512, COLS = 3, PER = 9, LABEL = 88;
const sheet = document.createElement('canvas');
sheet.width = COLS * CELL * 2; sheet.height = Math.ceil(PER / COLS) * (CELL + LABEL);
document.body.appendChild(sheet);
sheet.style.width = '100%';
const ctx = sheet.getContext('2d');

// shorten text to a pixel width with the current font
function fit(t, w) { if (ctx.measureText(t).width <= w) return t; while (t.length > 1 && ctx.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }

async function renderMap(m) {
  let gltf;
  try { gltf = await loader.loadAsync('/extracted/zones/' + m.model); } catch (e) { return null; }
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const map = o.material.map || null;
    if (map) { map.colorSpace = THREE.SRGBColorSpace; map.wrapS = map.wrapT = THREE.RepeatWrapping; }
    o.material = new THREE.MeshLambertMaterial({ map, vertexColors: true, side: THREE.DoubleSide });
  });
  scene.add(root);
  const b = new THREE.Box3().setFromObject(root), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.z) * 0.55 + 2;
  const out = [];
  // straight down (orthographic: true proportions, north up)
  const ortho = new THREE.OrthographicCamera(-r, r, r, -r, 0.1, s.y + r * 4 + 100);
  ortho.position.set(c.x, b.max.y + r + 50, c.z); ortho.up.set(0, 0, -1); ortho.lookAt(c.x, c.y, c.z);
  renderer.render(scene, ortho); out.push(await createImageBitmap(gl));
  // 3/4 view
  const persp = new THREE.PerspectiveCamera(45, 1, 0.5, r * 20 + 2000);
  persp.position.set(c.x + r * 1.1, c.y + r * 1.0, c.z + r * 1.1); persp.lookAt(c);
  renderer.render(scene, persp); out.push(await createImageBitmap(gl));
  scene.remove(root);
  root.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  return out;
}

let page = 0;
for (let i = 0; i < list.length; i += PER) {
  ctx.fillStyle = '#15181d'; ctx.fillRect(0, 0, sheet.width, sheet.height);
  for (let k = 0; k < PER && i + k < list.length; k++) {
    const m = list[i + k];
    st(`sheet ${page + 1}: ${i + k + 1}/${list.length} ${m.model}`);
    const imgs = await renderMap(m);
    const x = (k % COLS) * CELL * 2, y = Math.floor(k / COLS) * (CELL + LABEL);
    if (imgs) { ctx.drawImage(imgs[0], x, y + LABEL, CELL, CELL); ctx.drawImage(imgs[1], x + CELL, y + LABEL, CELL, CELL); }
    ctx.strokeStyle = '#555'; ctx.strokeRect(x + 0.5, y + 0.5, CELL * 2 - 1, CELL + LABEL - 1);
    ctx.fillStyle = '#ffd27a'; ctx.font = 'bold 26px system-ui';
    ctx.fillText(`#${i + k + 1}  ${m.age || ''}  ·  ${m.model.replace('.glb', '')}`, x + 12, y + 28);
    ctx.fillStyle = '#ccd'; ctx.font = '20px system-ui';
    ctx.fillText(fit(`${m.kind} · ${m.width_m} x ${m.depth_m} m · zone rows ${m.zones.join(' ')}`, CELL * 2 - 24), x + 12, y + 52);
    ctx.fillStyle = '#9fe0a8'; ctx.font = 'bold 22px system-ui, "Yu Gothic UI", "Meiryo", sans-serif';
    ctx.fillText(fit(m.names || '(no name)', CELL * 2 - 24), x + 12, y + 80);
  }
  const name = `maps_${String(page + 1).padStart(2, '0')}.png`;
  await fetch(`http://127.0.0.1:${savePort}/save?name=${name}`, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: sheet.toDataURL('image/png') });
  page++;
}
st(`done: ${page} sheets, ${list.length} maps`);
document.title = 'DONE ' + page;
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>one piece</title>
<style>html,body{margin:0;height:100%;background:#2b2d33;color:#ddd;font:12px system-ui}#info{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="info">loading…</div>
<script type="module">
// Debug page: /viewer/piece.html?glb=<path under /extracted/models/>&tex=<path under /extracted/sheets/>&view=front|side|top&skin=1
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2d33);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(1, 2, 3); scene.add(dl);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
const info = document.getElementById('info');
const loader = new GLTFLoader();
loader.load('/extracted/models/' + q.get('glb'), (g) => {
  const root = g.scene; scene.add(root);
  let tex = null;
  if (q.get('tex')) { tex = new THREE.TextureLoader().load('/extracted/sheets/' + q.get('tex')); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; }
  const names = [];
  root.traverse((o) => {
    if (o.isMesh) {
      o.material = new THREE.MeshLambertMaterial({ map: tex, color: tex ? 0xffffff : 0xb0b0b0, side: THREE.DoubleSide, alphaTest: 0.4, transparent: false });
      o.frustumCulled = false; names.push(o.name);
      if (o.isSkinnedMesh && q.get('skin') !== '0') { o.skeleton.pose(); }
    }
  });
  if (q.get('skel')) scene.add(new THREE.SkeletonHelper(root));
  const box = new THREE.Box3().setFromObject(root); const size = new THREE.Vector3(); box.getSize(size); const c = new THREE.Vector3(); box.getCenter(c);
  const d = Math.max(size.x, size.y, size.z) * 1.8 + 0.01;
  const v = q.get('view') || 'front';
  camera.position.set(c.x + (v === 'side' ? d : 0), c.y + (v === 'top' ? d : 0), c.z + (v === 'front' ? d : 0));
  controls.target.copy(c); controls.update();
  info.textContent = `${q.get('glb')}\n${q.get('tex') || '(no texture)'}\nmeshes ${names.length}  bbox ${box.min.toArray().map(x => x.toFixed(3))} .. ${box.max.toArray().map(x => x.toFixed(3))}`;
  window.ready = true;
}, undefined, (e) => { info.textContent = 'error ' + e; });
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script></body></html>
